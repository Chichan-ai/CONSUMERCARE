            <div class="page-header">
                <div>
                    <div class="page-title">PERFORMANCE MONITOR</div>
                    <div class="page-subtitle">CCS Daily Monitoring Module</div>
                </div>
                <div class="dashboard-header-actions">
                    <div id="loading-state" class="hidden">
                        <div id="loading-indicator">
                            <div class="spinner"></div>
                            <span class="pulse">SYNCING...</span>
                        </div>
                    </div>
                    <button onclick="refreshDashboardData()" class="btn btn-ghost btn-sm">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                        REFRESH
                    </button>
                </div>
            </div>

            <!-- Filter Bar: quick-filter by status/severity -->
            <div id="filter-bar">
                <button class="filter-chip active" data-filter="all" onclick="applyFilter('all', this)">ALL TICKETS</button>
                <button class="filter-chip chip-orange" data-filter="pending" onclick="applyFilter('pending', this)">PENDING</button>
                <button class="filter-chip chip-red" data-filter="critical" onclick="applyFilter('critical', this)">CRITICAL</button>
                <button class="filter-chip" data-filter="today" onclick="applyFilter('today', this)">TODAY</button>
                <button class="filter-chip" data-filter="resolved" onclick="applyFilter('resolved', this)">RESOLVED</button>
                <span class="filter-count-label" id="filter-count-label"></span>
            </div>

            <div class="stats-grid">
                <div class="card stat-card stripe-muted">
                    <div class="label">Total Tickets</div>
                    <div class="stat-num" id="stat-total">0</div>
                </div>
                <div class="card stat-card stripe-accent">
                    <div class="label">Resolved</div>
                    <div class="stat-num text-accent" id="stat-resolved">0</div>
                </div>
                <div class="card stat-card stripe-orange pending-stat-card" role="button" tabindex="0" onclick="viewPendingTickets()" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); viewPendingTickets(); }">
                    <div class="stat-heading-row">
                        <span class="label">Active Pending</span>
                        <span class="stat-view-link"></span>
                    </div>
                    <div class="stat-num text-orange" id="stat-pending">0</div>
                </div>
                <div class="card stat-card stripe-blue">
                    <div class="label">Avg Resolution Time</div>
                    <div class="stat-num text-blue" id="stat-tat">0h</div>
                </div>
            </div>
            <!-- Extended KPI row (2 extras) -->
            <div class="stats-grid extended-stats-grid">
                <div class="card stat-card stripe-accent">
                    <div class="label">SLA Compliance</div>
                    <div class="stat-num text-accent" id="stat-sla">--%</div>
                    <div class="kpi-trend kpi-up" id="stat-sla-trend"></div>
                </div>
                <div class="card stat-card stripe-red">
                    <div class="label">Critical Open</div>
                    <div class="stat-num text-red" id="stat-critical">0</div>
                    <div class="kpi-trend" id="stat-critical-trend"></div>
                </div>
                <div class="card stat-card stripe-purple">
                    <div class="label">Channel: App</div>
                    <div class="stat-num text-purple" id="stat-app">0</div>
                </div>
                <div class="card stat-card stripe-yellow">
                    <div class="label">Escalated</div>
                    <div class="stat-num text-yellow" id="stat-escalated">0</div>
                </div>
            </div>

            <div class="charts-grid">
                <div class="card branch-chart-card">
                    <div class="card-header">
                        <div class="dot dot-green"></div>
                        <span class="label">Branch Volume</span>
                    </div>
                    <div class="chart-panel">
                        <canvas id="branchChart"></canvas>
                    </div>
                </div>

                <div class="card live-database-card">
                    <div class="card-header live-database-header">
                        <div class="live-database-title">
                            <div class="dot dot-amber"></div>
                            <span class="label">Live Database</span>
                        </div>
                        <div class="search-wrap dashboard-search-wrap">
                            <svg class="search-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="tableSearch" class="input dashboard-search-input" placeholder="Name or ticket #..." onkeyup="filterDashboardTable()">
                        </div>
                            <button onclick="showAllTickets()" class="btn btn-ghost btn-sm" aria-label="Show all tickets" title="Show all tickets">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                            </button>
                    </div>
                    <div class="table-wrap dashboard-table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Ticket #</th>
                                    <th>Client</th>
                                    <th>Branch</th>
                                    <th>Severity</th>
                                    <th class="status-heading">Status</th>
                                </tr>
                            </thead>
                            <tbody id="daily-report-body"></tbody>
                        </table>
                    </div>
                </div>

                <div class="card engagement-chart-card">
                    <div class="card-header">
                        <div class="dot dot-green"></div>
                        <span class="label">Type of Engagement</span>
                    </div>
                    <div class="chart-panel">
                        <canvas id="engagementChart"></canvas>
                    </div>
                </div>

                <div class="card ticket-chart-card">
                    <div class="card-header">
                        <div class="dot dot-red"></div>
                        <span class="label">Ticket Type Breakdown</span>
                    </div>
                    <div class="chart-panel">
                        <canvas id="ticketChart"></canvas>
                    </div>
                </div>
            </div>
