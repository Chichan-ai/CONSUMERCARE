<div class="login-layout">
    <section class="login-brand-panel" aria-label="Announcements">
        <div class="login-ad-carousel" id="login-ad-carousel" aria-label="Advertisements">
            <p class="login-ad-loading">Loading announcements...</p>
        </div>
    </section>

    <aside class="login-panel" aria-label="Consumer Care sign in">
        <header class="login-panel-header">
            <img
                class="login-panel-wordmark"
                src="https://chichan-ai.github.io/CBAMS2.0/assets/ABC-RB%20%20-%20APPROVED%20%20LOGO%20-%20FULL%20COLOR-01.png"
                alt="Agribank">
            <h1 class="login-panel-title">Consumer Care | Log in</h1>
        </header>

        <div class="login-form" role="group" aria-label="Sign in">
            <div class="login-field">
                <label class="login-label" for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    oninput="this.value = this.value.toUpperCase()"
                    class="login-input"
                    autocomplete="username">
            </div>

            <div class="login-field login-password-field">
                <label class="login-label" for="password">Password</label>
                <div class="login-password-control">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        class="login-input"
                        autocomplete="current-password">
                    <button type="button" id="toggleBtn" class="login-pw-toggle" aria-label="Show password" aria-pressed="false">
                        <span id="eyeIcon">Show Password</span>
                    </button>
                </div>
            </div>

            <button type="button" onclick="handleLogin()" id="loginBtn" class="login-btn">Sign in</button>
            <p id="login-error" class="hidden login-error-msg" aria-live="polite"></p>
        </div>

        <section class="login-notification-note" aria-labelledby="login-notification-title">
            <h2 id="login-notification-title">Notifications</h2>
            <p>Sign in to view pending tickets, critical alerts, and recent notifications.</p>
        </section>

        <p class="login-version">Version 2.0.0</p>
    </aside>

</div>
