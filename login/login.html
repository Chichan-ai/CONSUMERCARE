    <div class="login-card">

        <!-- ── Header band with logo + title ── -->
        <div class="login-card-header">
            <!-- Logo: replace src with your actual logo file -->
            <div class="login-logo-wrap">
                <!-- If you have a logo image, replace the SVG below with:
                     <img src="YOUR_LOGO.png" alt="Agribank Logo">
                     For now we use the Agribank-style wheat icon as placeholder -->
                <img src="D:\Users\Lenovo\Downloads\files\ABC-RB  - APPROVED  LOGO - FULL COLOR-08.png" style="width:100px;height:100px;object-fit:contain"/>
                    <!-- Stalk -->
                    <line x1="32" y1="56" x2="32" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <!-- Left curve -->
                    <path d="M32 44 Q20 38 22 26" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <!-- Right curve -->
                    <path d="M32 44 Q44 38 42 26" stroke="white" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <!-- Grain head left -->
                    <ellipse cx="22" cy="23" rx="5" ry="8" fill="white" opacity="0.85" transform="rotate(-12 22 23)"/>
                    <!-- Grain head right -->
                    <ellipse cx="42" cy="23" rx="5" ry="8" fill="white" opacity="0.85" transform="rotate(12 42 23)"/>
                    <!-- Top grain -->
                    <ellipse cx="32" cy="14" rx="5" ry="8" fill="white" opacity="0.9"/>
                    <!-- Roots -->
                    <path d="M32 56 Q26 52 24 58" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                    <path d="M32 56 Q38 52 40 58" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
                </svg>
            </div>
            <div class="login-title">CONSUMER<span>CARE</span></div>
            <div class="login-subtitle">DIGITAL BANKING</div>
        </div>

        <!-- ── Form body ── -->
        <div class="login-card-body">
            <div style="display:flex; flex-direction:column; gap:18px;">

                <!-- Username -->
                <div>
                    <label class="login-label">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:middle;margin-right:5px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        oninput="this.value = this.value.toUpperCase()"
                        class="login-input"
                        style="text-transform:uppercase; letter-spacing:0.05em;"
                        autocomplete="username">
                </div>

                <!-- Password -->
                <div>
                    <label class="login-label">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:middle;margin-right:5px;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                        Password
                    </label>
                    <div style="position:relative;">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            class="login-input"
                            style="padding-right:64px;"
                            autocomplete="current-password">
                        <button type="button" id="toggleBtn" class="login-pw-toggle">
                            <span id="eyeIcon">SHOW</span>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button onclick="handleLogin()" id="loginBtn" class="login-btn" style="margin-top:4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                    LOGIN
                </button>

                <!-- Error message -->
                <p id="login-error" class="hidden login-error-msg"></p>

            </div>
        </div>

        <!-- ── Footer ── -->
        <div class="login-card-footer">
            <p class="login-footer-text">
                Beta Version &nbsp;·&nbsp; Agribank
            </p>
        </div>

    </div>
